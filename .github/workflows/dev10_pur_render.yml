name: DEV10-v2 — PUR render

# Route SANGUINALA V1 (PR2) : pack -> N MP4.
#   BRIDGE/IN   packs recuperes (MARK1 ou PUR)
#   BRIDGE/PUR  un pack PUR mono-clip par angle (ecrit par convert_pur_pack.mjs)
#   BRIDGE/OUT  pur_manifest.json (dev10.pur.v1)
#   F00_SOURCE/OUT  segments VOD
#   F01_LOOK/OUT    LOOK Remotion : style + titre du pack + logo (terminal en V1)
#   OUT             bundle : N MP4 verifies (P-AGG / P-AUD)
#   F05/OUT, F06_LUTHER/OUT  reencodage + LUT
# Heisenberg n'est PAS appele : pas de jump cut, pas de SFX, pas de b-roll en V1.

on:
  workflow_dispatch:
    inputs:
      pack_url:
        description: "URL raw du pack (recommande). Vide = utilise pack_filter."
        required: false
        default: ""
      codex_render_url:
        description: "URL raw du codex render (defaut : REVIEW/codex_render.json committe)"
        required: false
        default: ""
      vod_url:
        description: "VOD source, seulement si le pack n a pas source.vod_url"
        required: false
        default: ""
      pack_filter:
        description: "Repli : filtre nom dans l EXPORT PERTURABO. Vide = rien."
        required: false
        default: ""
      canvas:
        description: "Canvas LOOK"
        required: false
        default: "9:16"
        type: choice
        options: ["9:16", "16:9", "1:1"]
      perturabo_repo:
        description: "Repo PERTURABO EXPORT"
        required: false
        default: "gyutedy/PERTURABO"
      perturabo_branch:
        description: "Branche PERTURABO EXPORT"
        required: false
        default: "pari-forge-perturabo-xs4c"
      style:
        description: "Style LOOK (G0-S). blur | reframing seulement en V1."
        required: false
        default: "blur"
        type: choice
        options: ["blur", "reframing"]
      max_parallel:
        description: "Jobs paralleles max"
        required: false
        default: "5"

concurrency:
  group: dev10-v2-pur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare (fetch + G0 + packs mono-clip + matrix)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch PUR pack (URL operateur)
        env:
          PACK_URL: ${{ github.event.inputs.pack_url }}
          VOD_URL: ${{ github.event.inputs.vod_url }}
          PERTURABO_REPO: ${{ github.event.inputs.perturabo_repo }}
          PERTURABO_BRANCH: ${{ github.event.inputs.perturabo_branch }}
          PACK_FILTER: ${{ github.event.inputs.pack_filter }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p BRIDGE/IN BRIDGE/PUR BRIDGE/OUT
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          url = (os.environ.get("PACK_URL") or "").strip()
          vod = (os.environ.get("VOD_URL") or "").strip()
          repo = os.environ.get("PERTURABO_REPO") or "gyutedy/PERTURABO"
          branch = os.environ.get("PERTURABO_BRANCH") or "pari-forge-perturabo-xs4c"
          export = "MONDES_FORGES/CLIPPING/EXPORT"
          filt = (os.environ.get("PACK_FILTER") or "").strip().lower()
          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {"User-Agent": "LACRIMAE"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          dest = Path("BRIDGE/IN")
          dest.mkdir(parents=True, exist_ok=True)

          # VOIE 1 (nominale) : l operateur donne l URL exacte du pack.
          # Aucun listing, aucun filtre, aucune surprise.
          if url:
              name = url.split("?")[0].rstrip("/").rsplit("/", 1)[-1]
              if not name.endswith(".json"):
                  raise SystemExit(f"pack_url ne pointe pas un .json : {name!r}")
              req = urllib.request.Request(url, headers=headers)
              data = urllib.request.urlopen(req, timeout=180).read()
              pack = json.loads(data.decode("utf-8"))
              if not (pack.get("assets") or pack.get("montage_instructions")):
                  raise SystemExit("le pack ne contient ni assets[] ni montage_instructions")
              (dest / name).write_bytes(data)
              print("fetched", name, f"({len(data)} o)")

          # VOIE 2 (repli explicite) : pack_filter, si l URL n est pas donnee.
          elif filt:
              api = (f"https://api.github.com/repos/{repo}/contents/{export}?ref={branch}")
              req = urllib.request.Request(api, headers={
                  **headers, "Accept": "application/vnd.github+json"})
              listing = json.loads(urllib.request.urlopen(req, timeout=90).read().decode())
              packs = [f for f in listing if f.get("type") == "file"
                       and f["name"].startswith("production_pack_")
                       and f["name"].endswith(".json")
                       and filt in f["name"].lower()]
              if not packs:
                  raise SystemExit(f"aucun pack ne contient {filt!r}")
              for item in packs:
                  r = urllib.request.Request(item["download_url"], headers=headers)
                  (dest / item["name"]).write_bytes(urllib.request.urlopen(r, timeout=180).read())
                  print("fetched", item["name"])
          else:
              raise SystemExit("ni pack_url ni pack_filter : rien a rendre")

          # source.vod_url : une seule source de verite. On ne l ecrase jamais.
          for path in sorted(dest.glob("*.json")):
              pack = json.loads(path.read_text(encoding="utf-8"))
              source = dict(pack.get("source") or {})
              if str(source.get("vod_url") or "").strip():
                  print(f"vod_url present dans {path.name}")
                  continue
              if not vod:
                  raise SystemExit(
                      f"{path.name} : source.vod_url absent et vod_url non fourni")
              source["vod_url"] = vod
              pack["source"] = source
              path.write_text(json.dumps(pack, ensure_ascii=False, indent=2), encoding="utf-8")
              print(f"vod_url injecte dans {path.name}")
          PY
      - name: Adapter MARK1 (un seul pack source de verite)
        run: |
          set -euo pipefail
          shopt -s nullglob
          MARK1=(BRIDGE/IN/production_pack_mark1_*.json)
          if [ ${#MARK1[@]} -gt 0 ]; then
            for p in "${MARK1[@]}"; do
              python3 BRIDGE/CODEBASE/lac_adapter_mark1.py --pack "$p" --out BRIDGE/IN
            done
            # Un pack MARK1 porte N clips : les packs PUR du meme token sont des
            # derives du meme contenu. On les retire pour ne pas convertir 2 fois.
            for p in BRIDGE/IN/production_pack_pur_*.json; do
              echo "derive ignore (MARK1 present) : $p"
              rm -f "$p"
            done
          else
            echo "aucun pack MARK1 : packs PUR utilises tels quels"
          fi
          ls -la BRIDGE/IN
      - name: "Codex render (W1-R : le codex commande)"
        env:
          CODEX_URL: ${{ github.event.inputs.codex_render_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODEX_URL:-}" ]; then
            python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          url = os.environ["CODEX_URL"].strip()
          req = urllib.request.Request(url, headers={
              "User-Agent": "LACRIMAE",
              "Authorization": f"Bearer {os.environ.get('GITHUB_TOKEN','')}",
          })
          data = urllib.request.urlopen(req, timeout=120).read()
          Path("REVIEW/codex_render.json").write_bytes(data)
          print("codex render recupere :", url, f"({len(data)} o)")
          PY
          else
            echo "codex render : REVIEW/codex_render.json committe"
          fi
          python3 tools/codex.py check REVIEW/codex_render.json --gate
          python3 - <<'PY'
          import json
          c = json.load(open("REVIEW/codex_render.json", encoding="utf-8"))
          print("  style :", c["style"], "| canvas :", c["canvas"], c["fps"], "fps")
          print("  titre :", c["title"])
          print("  logo  :", c["logo"])
          PY
      - name: Watermark PNG (pack -> BRIDGE/IN)
        env:
          PERTURABO_REPO: ${{ github.event.inputs.perturabo_repo }}
          PERTURABO_BRANCH: ${{ github.event.inputs.perturabo_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          repo = os.environ.get("PERTURABO_REPO") or "gyutedy/PERTURABO"
          branch = os.environ.get("PERTURABO_BRANCH") or "pari-forge-perturabo-xs4c"
          base = f"https://raw.githubusercontent.com/{repo}/{branch}/MONDES_FORGES/CLIPPING/EXPORT"
          headers = {"User-Agent": "LACRIMAE"}
          if os.environ.get("GITHUB_TOKEN"):
              headers["Authorization"] = f"Bearer {os.environ['GITHUB_TOKEN']}"

          wanted = {}
          for p in sorted(Path("BRIDGE/IN").glob("production_pack_*.json")):
              pack = json.loads(p.read_text(encoding="utf-8"))
              wm = pack.get("watermark") or {}
              f = str(wm.get("file") or "").strip()
              if f:
                  wanted[f] = wm.get("required") is True
              elif wm.get("required") is True:
                  raise SystemExit("P3 : watermark requis mais watermark.file vide dans " + p.name)

          for name, required in wanted.items():
              dest = Path("BRIDGE/IN") / name
              if dest.is_file():
                  print("watermark deja present :", name)
                  continue
              try:
                  req = urllib.request.Request(f"{base}/{name}", headers=headers)
                  data = urllib.request.urlopen(req, timeout=120).read()
              except Exception as exc:
                  raise SystemExit(f"watermark {name} introuvable dans {repo}:{branch} ({exc})")
              dest.write_bytes(data)
              print("watermark recupere :", name, f"({len(data)} o)")
          if not wanted:
              print("aucun watermark declare dans les packs")
          PY
          ls -la BRIDGE/IN
      - name: "Convert pack (G0-S + packs mono-clip, codex_render)"
        run: |
          set -euo pipefail
          shopt -s nullglob
          PACKS=(BRIDGE/IN/production_pack_*.json)
          if [ ${#PACKS[@]} -eq 0 ]; then
            echo "aucun pack" >&2
            exit 1
          fi
          JOIN=$(IFS=,; echo "${PACKS[*]}")
          node tools/convert_pur_pack.mjs \
            --packs "$JOIN" \
            --out BRIDGE/OUT/pur_manifest.json \
            --packs-out BRIDGE/PUR \
            --codex-render REVIEW/codex_render.json \
            --canvas "${{ github.event.inputs.canvas }}" \
            --style "${{ github.event.inputs.style }}"
          python3 - <<'PY'
          import json
          m = json.load(open("BRIDGE/OUT/pur_manifest.json", encoding="utf-8"))
          logo = (m.get("narrative") or {}).get("logo") or {}
          if not logo.get("enabled"):
              raise SystemExit("codex/logo : logo.enabled=false — le pack exige un watermark")
          print("logo :", logo.get("src"), logo.get("position"), str(logo.get("width_pct")) + "%")
          PY
      - name: Build matrix (1 angle = 1 pack mono-clip = 1 job)
        id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          man = json.loads(Path("BRIDGE/OUT/pur_manifest.json").read_text(encoding="utf-8"))
          entries = man.get("entries") or []
          packs = sorted(Path("BRIDGE/PUR").glob("production_pack_*.json"))
          if not packs:
              raise SystemExit("aucun pack mono-clip dans BRIDGE/PUR (--packs-out ?)")
          if len(packs) != len(entries):
              raise SystemExit(
                  f"derive : {len(entries)} entree(s) au manifeste vs {len(packs)} pack(s) mono-clip")
          items = []
          for i, p in enumerate(packs):
              pack = json.loads(p.read_text(encoding="utf-8"))
              angle = (pack.get("identite") or {}).get("angle_id") or p.stem.rsplit("_", 1)[-1]
              items.append({"index": i, "angle": angle, "pack": p.as_posix()})
          print("count", len(items))
          for it in items:
              print(" ", it["angle"], "->", it["pack"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("count=" + str(len(items)) + "\n")
              fh.write("matrix=" + json.dumps({"include": items}) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pur-prepare
          path: |
            BRIDGE/IN/
            BRIDGE/PUR/
            BRIDGE/OUT/pur_manifest.json

  render:
    name: render ${{ matrix.angle }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg + yt-dlp (PATH verifie)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          pip3 install --break-system-packages yt-dlp
          command -v ffmpeg && command -v ffprobe && command -v yt-dlp
          ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: pur-prepare
          path: RUNNER_TEMP/prepare
      - name: Restore prepare tree
        run: |
          set -euo pipefail
          mkdir -p BRIDGE/IN BRIDGE/PUR BRIDGE/OUT
          find RUNNER_TEMP/prepare -name 'production_pack_*.json' \
            -path '*BRIDGE/IN*' -exec cp -f {} BRIDGE/IN/ \;
          find RUNNER_TEMP/prepare -name 'production_pack_pur_*.json' \
            -exec cp -f {} BRIDGE/PUR/ \;
          find RUNNER_TEMP/prepare -name 'pur_manifest.json' -exec cp -f {} BRIDGE/OUT/ \;
          find RUNNER_TEMP/prepare -name '*.png' -exec cp -f {} BRIDGE/IN/ \;
          ls -la BRIDGE/IN BRIDGE/PUR BRIDGE/OUT
      - name: F00_SOURCE segment
        run: |
          set -euo pipefail
          test -f "${{ matrix.pack }}"
          python3 F00_SOURCE/CODEBASE/f00_pur.py \
            --pack "${{ matrix.pack }}" \
            --out F00_SOURCE/OUT \
            --clip-name "pur_${{ matrix.angle }}.mp4"
      - name: F01_LOOK LOOK (style + titre du pack + logo)
        run: |
          set -euo pipefail
          cd F01_LOOK/CODEBASE
          npm ci --no-fund --no-audit
          npx remotion browser ensure
          node render_pictor.mjs \
            --manifest ../../BRIDGE/OUT/pur_manifest.json \
            --clips ../../F00_SOURCE/OUT \
            --out ../../F01_LOOK/OUT \
            --watermarks ../../BRIDGE/IN \
            --entry ${{ matrix.index }}
      - name: Verifie le MP4 sorti
        run: |
          set -euo pipefail
          MP4="F01_LOOK/OUT/pur_${{ matrix.angle }}_look.mp4"
          test -s "$MP4" || { echo "rendu absent : $MP4" >&2; ls -la F01_LOOK/OUT >&2 || true; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=nw=1 "$MP4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=nw=1 "$MP4"
      - uses: actions/upload-artifact@v4
        with:
          name: pur-result-${{ matrix.angle }}
          path: F01_LOOK/OUT/pur_${{ matrix.angle }}_look.mp4

  aggregate:
    name: aggregate + F05/F06
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg (PATH verifie)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          command -v ffmpeg && command -v ffprobe
      - uses: actions/download-artifact@v4
        with:
          name: pur-prepare
          path: RUNNER_TEMP/prepare
      - name: Restore prepare tree
        run: |
          set -euo pipefail
          mkdir -p BRIDGE/IN BRIDGE/PUR BRIDGE/OUT
          find RUNNER_TEMP/prepare -name 'production_pack_*.json' \
            -path '*BRIDGE/IN*' -exec cp -f {} BRIDGE/IN/ \;
          find RUNNER_TEMP/prepare -name 'production_pack_pur_*.json' \
            -exec cp -f {} BRIDGE/PUR/ \;
          find RUNNER_TEMP/prepare -name 'pur_manifest.json' -exec cp -f {} BRIDGE/OUT/ \;
      - uses: actions/download-artifact@v4
        with:
          pattern: pur-result-*
          path: RUNNER_TEMP/results
          merge-multiple: true
      - name: P-AGG MULTI + P-AUD
        run: |
          set -euo pipefail
          python3 tools/pur_aggregate.py \
            --manifest BRIDGE/OUT/pur_manifest.json \
            --results RUNNER_TEMP/results \
            --out OUT
      - name: F05 + F06 batch
        run: |
          set -euo pipefail
          python3 F05/CODEBASE/lac_f05_camouflage.py --batch OUT --output F05/OUT
          python3 F06_LUTHER/CODEBASE/lac_f06_luther.py --batch F05/OUT --output F06_LUTHER/OUT
      - uses: actions/upload-artifact@v4
        with:
          name: pur-bundle
          path: |
            F06_LUTHER/OUT/
            F05/OUT/camouflage_batch_report.json
            OUT/pur_aggregate_report.json
